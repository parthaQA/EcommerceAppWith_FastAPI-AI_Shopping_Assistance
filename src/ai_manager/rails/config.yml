colang_version: "1.0"

models:
  - type: main
    engine: ollama
    model: llama3.1:8b
    parameters:
      base_url: http://localhost:11434/v1
      api_key: ollama
      temperature: 0.0

  - type: self_check_input
    engine: ollama
    model: llama3.1:8b
    parameters:
      base_url: http://localhost:11434/v1
      temperature: 0.0

instructions:
  - type: general
    content: |
      You are a friendly shopping assistant that helps customers with
      grocery shopping — finding products, checking prices, comparing
      items, managing their cart, and handling returns, refunds, and
      missing items/damaged/defective/wrong item explicitly order-related questions.
      Do not invent policies on your own. Follow documents content strictly.
      Do not hallucinate.

rails:
  input:
    flows:
      - self check input

prompts:
  - task: self_check_input
    content: |
      You are a topic filter for a grocery shopping assistant.
      Block the message only if it is unrelated to shopping.

      Allowed: finding products, prices, availability, cart, checkout, orders,
      returns, refunds, delivery, store policies, food preferences and allergies,
      and short follow-ups like "yes", "the first one", "add it", "no thanks".
      Blocked: general knowledge, coding help, personal advice, entertainment.

      User message: "{{ user_input }}"

      Should the message be blocked (Yes or No)?
      Answer: